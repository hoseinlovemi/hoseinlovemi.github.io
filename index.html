<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه انیونس</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-white shadow p-4 text-center text-2xl font-bold">فروشگاه کالای خانگی انیونس</header>

  <main class="p-4 grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-cols-3">
    <!-- Product 1 -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden">
      <img src="/products/spice-rack.jpg" alt="جا ادویه چرخشی 12 تایی" class="w-full h-52 object-cover">
      <div class="p-4">
        <h2 class="text-lg font-semibold mb-1">جا ادویه چرخشی 12 تایی</h2>
        <p class="text-green-600 font-bold mb-3">۳۲۰,۰۰۰ تومان</p>
        <a href="https://wa.me/989123456789?text=سلام،%20من%20علاقه‌مند%20به%20خرید%20جا%20ادویه%20چرخشی%20هستم" target="_blank" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">سفارش از واتساپ</a>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden">
      <img src="/products/fridge-organizer.jpg" alt="نظم‌دهنده یخچال (ست ۶ تایی)" class="w-full h-52 object-cover">
      <div class="p-4">
        <h2 class="text-lg font-semibold mb-1">نظم‌دهنده یخچال (ست ۶ تایی)</h2>
        <p class="text-green-600 font-bold mb-3">۲۴۵,۰۰۰ تومان</p>
        <a href="https://wa.me/989123456789?text=سلام،%20من%20ست%20نظم‌دهنده%20یخچال%20رو%20می‌خواستم" target="_blank" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">سفارش از واتساپ</a>
      </div>
    </div>

    <!-- Product 3 -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden">
      <img src="/products/cabinet-bin.jpg" alt="سطل زباله کابینتی" class="w-full h-52 object-cover">
      <div class="p-4">
        <h2 class="text-lg font-semibold mb-1">سطل زباله کابینتی</h2>
        <p class="text-green-600 font-bold mb-3">۱۸۰,۰۰۰ تومان</p>
        <a href="https://wa.me/989123456789?text=سلام،%20در%20مورد%20سطل%20زباله%20کابینتی%20سوال%20داشتم" target="_blank" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">سفارش از واتساپ</a>
      </div>
    </div>
  </main>

  <footer class="text-center p-4 text-sm text-gray-500">© 2025 فروشگاه انیونس - تمام حقوق محفوظ است</footer>
</body>
</html>
